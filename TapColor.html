<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TapColor — Угадай цвет</title>
<style>
  :root {
    --ink: #16181d;
    --muted: #6b7280;
    --line: rgba(20, 22, 28, 0.10);
    --card: rgba(255, 255, 255, 0.92);
    --shadow: 0 8px 30px rgba(15, 18, 30, 0.18), 0 1px 2px rgba(15, 18, 30, 0.10);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: #eceef1;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root { position: fixed; inset: 0; }
  canvas { display: block; }
  #palette { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  .markers { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  .marker {
    position: absolute; width: 22px; height: 22px; transform: translate(-50%, -50%);
    border-radius: 50%; border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 0 1.5px rgba(0,0,0,0.45), inset 0 0 0 1.5px rgba(0,0,0,0.30);
    transition: opacity .3s; opacity: .55;
  }
  .marker.latest { width: 30px; height: 30px; opacity: 1; border-width: 3px; }
  .marker.win { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 22px 6px rgba(255,255,255,0.7); }

  /* HUD top */
  .hud {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 0; z-index: 20;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    overflow: hidden;
  }
  .hud-cell { padding: 13px 22px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .hud-cell + .hud-cell { border-left: 1px solid var(--line); }
  .hud-label {
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .hud-target { padding-right: 26px; }
  .hud-code {
    font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: .01em;
    line-height: 1; display: flex; align-items: baseline; gap: 10px;
  }
  .hud-rgb { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
  .hud-stat { font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .hud-stat .unit { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }

  .brand {
    position: absolute; top: 24px; left: 26px; z-index: 20;
    display: flex; align-items: center; gap: 9px;
    font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    user-select: none;
  }
  .brand .dot { width: 13px; height: 13px; border-radius: 50%;
    background: conic-gradient(from 0deg, #ff3b30, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff3b30);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.5), 0 1px 4px rgba(0,0,0,0.35); }

  .reset-btn {
    position: absolute; top: 24px; right: 26px; z-index: 20;
    font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 16px; cursor: pointer; box-shadow: var(--shadow);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .12s ease, background .15s;
    display: flex; align-items: center; gap: 7px;
  }
  .reset-btn:hover { background: #fff; transform: translateY(-1px); }
  .reset-btn:active { transform: translateY(0); }

  /* Feedback bottom */
  .feedback {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px; z-index: 20;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); padding: 14px 18px;
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    opacity: 1; transform: translateX(-50%) translateY(0);
    transition: opacity .3s ease, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .feedback.enter { opacity: 0; transform: translateX(-50%) translateY(14px); }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .swatch-pair { display: flex; align-items: center; gap: 10px; }
  .swatch-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch {
    width: 52px; height: 52px; border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.10);
  }
  .swatch-cap { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .vs { font-size: 12px; color: var(--muted); font-weight: 600; }

  .match { display: flex; flex-direction: column; gap: 7px; min-width: 168px; padding-left: 4px; }
  .match-top { display: flex; align-items: baseline; justify-content: space-between; }
  .match-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .match-word { font-size: 12px; font-weight: 600; }
  .meter { height: 8px; border-radius: 999px; background: rgba(20,22,28,0.08); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 999px; transition: width .45s cubic-bezier(.2,.8,.2,1), background .45s; }
  .hint { font-size: 11px; color: var(--muted); }

  /* Win overlay */
  .win-wrap {
    position: absolute; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; pointer-events: none;
  }
  .win-card {
    pointer-events: auto; text-align: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow); padding: 34px 44px 30px;
    backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
    opacity: 1; transform: scale(1) translateY(0);
    transition: opacity .35s ease, transform .42s cubic-bezier(.18,.9,.25,1.2);
    max-width: 380px;
  }
  .win-card.enter { opacity: 0; transform: scale(.86) translateY(10px); }
  .win-card .big-swatch { width: 74px; height: 74px; border-radius: 16px; margin: 0 auto 16px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), 0 4px 14px rgba(0,0,0,0.16); }
  .win-title { font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
  .win-code { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-top: 4px; }
  .win-stats { display: flex; justify-content: center; gap: 0; margin: 22px 0 24px; }
  .win-stat { padding: 0 24px; }
  .win-stat + .win-stat { border-left: 1px solid var(--line); }
  .win-stat .v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .win-stat .l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 7px; }
  .win-rating { font-size: 13.5px; color: var(--ink); margin-bottom: 22px; font-weight: 500; }
  .play-btn {
    font-family: var(--sans); font-size: 15px; font-weight: 600; color: #fff;
    background: var(--ink); border: none; border-radius: 13px; padding: 13px 30px;
    cursor: pointer; transition: transform .12s, opacity .15s; width: 100%;
  }
  .play-btn:hover { opacity: .9; transform: translateY(-1px); }
  .play-btn:active { transform: translateY(0); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="palette.js"></script>
  <script src="confetti.js"></script>
  <script type="text/babel" src="game.jsx"></script>
</body>
</html>
